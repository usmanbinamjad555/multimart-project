services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb-server
    ports:
      # Bound to localhost only: MongoDB runs without auth, so it must not be reachable publicly
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: backend-api
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb-server:27017/multimart
      - NODE_ENV=development
      - PORT=8081
      # Secrets come from the shell environment or a root .env file (see .env.example)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRE=${JWT_EXPIRE:-30d}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@multimart.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend-app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
